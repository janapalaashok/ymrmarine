steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--no-cache'
      - '-t'
      - 'asia-south1-docker.pkg.dev/ymr-sms/cloud-run-source-deploy/ymrmarine/ymrmarine-staging:$COMMIT_SHA'
      - '.'

  # 2. Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/ymr-sms/cloud-run-source-deploy/ymrmarine/ymrmarine-staging:$COMMIT_SHA'

  # 3. Deploy to Cloud Run staging service — full explicit config
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ymrmarine-staging'
      - '--image'
      - 'asia-south1-docker.pkg.dev/ymr-sms/cloud-run-source-deploy/ymrmarine/ymrmarine-staging:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--add-cloudsql-instances'
      - 'ymr-sms:asia-south1:ymrmarine'
      - '--set-env-vars'
      - 'YMR_DB_HOST=/cloudsql/ymr-sms:asia-south1:ymrmarine,YMR_DB_USER=ymrmarine,YMR_DB_NAME=ymrmarine_staging,YSMS_DB_HOST=/cloudsql/ymr-sms:asia-south1:ymrmarine,YSMS_DB_USER=ysms_user,YSMS_DB_NAME=ysms_db_staging'
      - '--set-secrets'
      - 'YMR_DB_PASS=YMR_DB_PASS:latest,YSMS_DB_PASS=YSMS_DB_PASS:latest,YSMS_SMTP_PASSWORD=YSMS_SMTP_PASSWORD:latest'
      - '--add-volume'
      - 'name=uploads,type=cloud-storage,bucket=ymrmarine-uploads'
      - '--add-volume-mount'
      - 'volume=uploads,mount-path=/var/www/html/assets/uploads'
      - '--add-volume'
      - 'name=ysms-uploads,type=cloud-storage,bucket=ymrmarine-ysms-uploads'
      - '--add-volume-mount'
      - 'volume=ysms-uploads,mount-path=/var/www/html/YSMS/uploads'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/ymr-sms/cloud-run-source-deploy/ymrmarine/ymrmarine-staging:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
