<html lang="en">

<head>

    rel="stylesheet"

>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<title>YMR Marine Solutions | Global Marine Survey & Inspection Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
    /* YMR BRAND COLOURS */
    --brand-green: #004535;
    --brand-green-dark: #003326;
    --brand-blue: #00536B;
    --brand-cream: #F7F7F2;
    --brand-white: #FFFFFF;
    --brand-charcoal: #192523;
    --brand-sage: #A3B4AC;
    --brand-border: #E3E7E5;
    --navy: #050D1A;
    --navy-2: #091525;
    --navy-3: #0D1F36;
    --ocean: #0A2B52;
    --deep: #0E3A70;
    --blue: #1565C0;
    --vivid: #1976D2;
    --sky: #1E88E5;
    --accent: #00B4D8;
    --teal: #00ACC1;
    --teal-light: #4DD0E1;
    --white: #FFFFFF;
    --off-white: #F0F4F8;
    --silver: #B0BEC5;
    --muted: #607D8B;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.10);
    --card-bg: rgba(9,21,37,0.85);
    --section-gap: 100px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:16px}
    body{background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;line-height:1.6}
    h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em}

    /* SCROLLBAR */
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--navy)}
    ::-webkit-scrollbar-thumb{background:var(--deep);border-radius:3px}

    /* =========================================
    NAVIGATION
    ========================================= */

    #navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        height: 66px;
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        padding: 0;
        background: #ffffff;
        border-bottom: 1px solid #DADFD9;
        font-family: 'Inter', sans-serif;
        box-shadow: none;
    }

    #navbar.scrolled {
        background: #ffffff;
        box-shadow: none;
    }

    /* BRAND */

    #navbar .nav-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 22px;
        background: #082B4A;
        text-decoration: none;
        flex-shrink: 0;
        border: none;
    }

    #navbar .nav-logo-icon {
        width: 32px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
    }

    #navbar .nav-logo-icon svg {
        width: 100%;
        height: 100%;
        color: #ffffff;
    }

    #navbar .nav-logo-text {
        font-size: 17px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.04em;
        line-height: 1.2;
    }

    #navbar .nav-logo-sub {
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.16em;
        color: #D2E2DB;
        text-transform: uppercase;
        margin-top: 4px;
    }

    /* PRIMARY NAVIGATION */

    #navbar .nav-links {
        display: flex;
        flex: 1;
        align-items: stretch;
        justify-content: flex-start;
        gap: 4px;
        padding: 0 16px;
        margin: 0;
    }

    #navbar .nav-links > a,
    #navbar .nav-dropdown-toggle {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 100%;
        padding: 0 18px;
        color: #082B4A;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        text-decoration: none;
        background: transparent;
        border: none;
        cursor: pointer;
    }

    /* UNDERLINE INDICATOR */

    #navbar .nav-dropdown-toggle::after,
    #navbar .nav-links > a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 18px;
        right: 18px;
        height: 3px;
        background: #009BD3;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.2s ease;
    }

    #navbar .nav-dropdown:hover .nav-dropdown-toggle::after,
    #navbar .nav-dropdown:focus-within .nav-dropdown-toggle::after,
    #navbar .nav-links > a:hover::after {
        transform: scaleX(1);
    }

    /* DROPDOWN */

    .nav-dropdown {
        position: relative;
        display: flex;
        align-items: stretch;
    }

    .nav-chevron {
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg);
        margin-top: -4px;
        transition: transform 0.2s ease;
    }

    .nav-dropdown:hover .nav-chevron {
        transform: rotate(225deg);
    }

    .nav-dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 280px;
        background: #ffffff;
        padding: 12px 0;
        border: 1px solid #DADFD9;
        border-top: 3px solid #009BD3;
    }

    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown:focus-within .nav-dropdown-menu {
        display: block;
    }

    #navbar .nav-dropdown-menu a {
        display: block;
        padding: 15px 24px;
        font-size: 14px;
        font-weight: 400;
        color: #192523;
        text-decoration: none;
        transition: background 0.2s ease;
    }

    #navbar .nav-dropdown-menu a:hover {
        background: #E8F6FC;
        color: #009BD3;
    }

    /* UTILITY NAVIGATION */

    #navbar .nav-actions {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin-left: auto;
        padding: 0 12px;
        border-left: 1px solid #DADFD9;
    }

    .nav-utility-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        color: #192523;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: color 0.2s ease;
    }

    .nav-utility-link:hover {
        color: #00536B;
    }

    .nav-utility-link svg {
        width: 15px;
        height: 15px;
    }

    /* MOBILE BUTTON */

    #navbar .hamburger {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: 66px;
        flex-shrink: 0;
        background: transparent;
        border: none;
        border-left: 1px solid #DADFD9;
        cursor: pointer;
    }

    #navbar .hamburger span {
        width: 21px;
        height: 1.5px;
        background: #009BD3;
    }
    /* =========================================
    NEW HERO SECTION
    ========================================= */


    #hero {
        position: relative;
        min-height: 570px;
        padding: 85px 7%;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        overflow: hidden;
        color: #082B4A;
    }

    .hero-background,
    .hero-overlay {
        display: none;
    }

    .hero-container {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 65px;
        align-items: center;
    }

    /* LEFT SIDE */

    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 620px;
    }

    .hero-eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #009BD3;
        margin-bottom: 25px;
    }

    .hero-title {
        font-family: 'Inter', sans-serif;
        font-size: clamp(48px, 5vw, 76px);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: -0.055em;
        color: #082B4A;
        margin-bottom: 28px;
    }

    .hero-title span {
        color: #009BD3;
    }

    .hero-description {
        font-size: 17px;
        line-height: 1.85;
        color: #607487;
        max-width: 540px;
        margin-bottom: 34px;
    }

    .hero-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }

    .hero-btn-primary,
    .hero-btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
        min-height: 52px;
        padding: 15px 25px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 6px;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .hero-btn-primary {
        background: #009BD3;
        color: #FFFFFF;
    }

    .hero-btn-primary:hover {
        background: #007FB0;
        transform: translateY(-2px);
    }

    .hero-btn-secondary {
        background: #FFFFFF;
        color: #082B4A;
        border: 1px solid #D8E2E9;
    }

    .hero-btn-secondary:hover {
        background: #F5FAFD;
    }

    /* RIGHT SIDE — ANIMATED REPORT */

    .hero-demo {
        position: relative;
        min-width: 0;
        background: linear-gradient(145deg, #103D63, #082B4A);
        border-radius: 16px;
        padding: 35px;
        min-height: 345px;
        box-shadow: 0 24px 45px rgba(8,43,74,0.18);
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
    }

    .hero-demo::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(0,155,211,0.12);
        top: -170px;
        right: -100px;
    }

    .demo-stage {
        position: relative;
        z-index: 1;
        text-align: center;
        animation: demoFade 0.45s ease;
    }

    .demo-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: rgba(0,155,211,0.15);
        color: #8BDEFA;
        font-size: 28px;
    }

    .demo-stage-title {
        font-size: 23px;
        font-weight: 600;
        color: #FFFFFF;
        margin-bottom: 10px;
    }

    .demo-stage-description {
        font-size: 14px;
        line-height: 1.7;
        color: #B9D2E3;
        max-width: 350px;
        margin: 0 auto;
    }

    .demo-report {
        background: #FFFFFF;
        border-radius: 10px;
        padding: 22px;
        max-width: 310px;
        margin: 0 auto;
        text-align: left;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .demo-report-brand {
        color: #009BD3;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 18px;
    }

    .demo-report-title {
        color: #082B4A;
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .demo-report-subtitle {
        color: #607487;
        font-size: 12px;
        margin-bottom: 15px;
    }

    .demo-report-line {
        height: 7px;
        border-radius: 4px;
        background: #E9F1F6;
        margin-bottom: 8px;
    }

    .demo-report-line.short {
        width: 65%;
    }

    .demo-delivered {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 18px;
        border-radius: 30px;
        background: #009BD3;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 600;
    }

    /* DEMO CONTROLS */

    .demo-controls {
        position: absolute;
        bottom: 20px;
        left: 25px;
        right: 25px;
        z-index: 3;
    }

    .demo-controls-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        color: #FFFFFF;
        font-size: 11px;
    }

    .demo-play {
        border: none;
        background: rgba(255,255,255,0.15);
        color: #FFFFFF;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
    }

    .demo-progress {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
    }

    /* ANIMATED SURVEY PROGRESS BARS */

    .demo-progress-segment {
        position: relative;
        height: 4px;
        background: rgba(255,255,255,0.20);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
    }

    /* Loading fill */

    .demo-progress-segment::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: var(--demo-fill, 0%);
        height: 100%;
        background: #009BD3;
        border-radius: 3px;
    }

    /* Completed stages */

    .demo-progress-segment.completed::before {
        width: 100%;
    }

    /* Current stage */

    .demo-progress-segment.active::before {
        background: #65D8FF;
        box-shadow: 0 0 8px rgba(101,216,255,0.5);
    }

    /* Hover effect */

    .demo-progress-segment:hover {
        background: rgba(255,255,255,0.40);
    }

    .demo-progress-segment.active {
        background: #009BD3;
    }

    @keyframes demoFade {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================================
    HERO STATISTICS — NEW DESIGN
    ========================================= */

    .hero-metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        width: 100%;
        background: #FFFFFF;
        border-top: 1px solid #E1E8ED;
        border-bottom: 1px solid #E1E8ED;
        padding: 0 7%;
    }

    .hero-metric {
        padding: 32px 25px;
        border-right: 1px solid #E1E8ED;
    }

    .hero-metric:first-child {
        padding-left: 0;
    }

    .hero-metric:last-child {
        border-right: none;
    }

    .hero-metric-number {
        font-family: 'Inter', sans-serif;
        font-size: clamp(34px, 3.2vw, 52px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1.2;
        color: #082B4A;
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
    }

    .hero-metric-number span {
        color: #009BD3;
    }

    .hero-metric-label {
        font-size: 13px;
        color: #607487;
        line-height: 1.5;
    }

    /* TABLET */

    @media (max-width: 900px) {
        .hero-metrics {
            grid-template-columns: repeat(2, 1fr);
            padding: 0 5%;
        }

        .hero-metric {
            padding: 25px 20px;
            border-bottom: 1px solid #E1E8ED;
        }

        .hero-metric:nth-child(2) {
            border-right: none;
        }

        .hero-metric:nth-child(n+3) {
            border-bottom: none;
        }
    }

    /* MOBILE */

    @media (max-width: 500px) {
        .hero-metrics {
            padding: 0 20px;
        }

        .hero-metric {
            padding: 24px 12px;
        }

        .hero-metric-number {
            font-size: 32px;
        }

        .hero-metric-label {
            font-size: 12px;
        }
    }


    /* SECTIONS COMMON */
    section{padding:var(--section-gap) 40px}
    .section-tag{display:inline-block;font-size:11px;font-weight:700;color:#00a3df;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:14px;padding:6px 16px;border-radius:20px;background:rgba(0,180,216,0.1);border:1px solid rgba(0,180,216,0.2)}
    .section-title{font-size:clamp(28px,4vw,48px);font-weight:800;line-height:1.1;margin-bottom:16px;letter-spacing:-0.02em;color:#00a3df}
    .section-sub{font-size:17px;color:rgba(255,255,255,0.6);max-width:600px;line-height:1.7}
    .text-grad{background:linear-gradient(135deg,#00a3df,var(--teal-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .divider-line{width:60px;height:3px;background:linear-gradient(90deg,#00a3df,transparent);border-radius:2px;margin:20px 0}
    .centered{text-align:center}
    .centered .section-sub{margin:0 auto}
    .centered .divider-line{margin:20px auto}
    .animate-in{opacity:0;transform:translateY(30px);transition:all 0.6s ease}
    .animate-in.visible{opacity:1;transform:translateY(0)}
    /* =========================================
    ABOUT SECTION
    ========================================= */

    #about {
        background: #F7F7F2;
        padding: 100px 7%;
        color: #192523;
    }

    .about-container {
        max-width: 1400px;
        margin: 0 auto;
    }

    .about-eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #004535;
        margin-bottom: 20px;
    }

    .about-heading {
        font-family: 'Inter', sans-serif;
        font-size: clamp(32px, 4.5vw, 60px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.15;
        color: #004535;
        margin-bottom: 50px;
    }

    .about-grid {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 80px;
        align-items: center;
    }

    .about-photo {
        width: 100%;
        min-height: 480px;
        background-color: #D2E2DB;
        background-image: url('./about-surveyor.jpeg');
        background-size: cover;
        background-position: center;
    }

    .about-content h3 {
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 500;
        color: #004535;
        margin-bottom: 24px;
    }

    .about-content p {
        font-size: 16px;
        line-height: 1.85;
        color: #52615B;
        margin-bottom: 22px;
    }

    .about-link {
        display: inline-flex;
        align-items: center;
        gap: 40px;
        padding-bottom: 10px;
        margin-top: 16px;
        color: #004535;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid #004535;
        transition: gap 0.2s ease;
    }

    .about-link:hover {
        gap: 55px;
    }
    /* =========================================
    SERVICES SECTION
    ========================================= */

    #services {
        background: #FFFFFF;
        padding: 100px 7%;
        color: #192523;
    }

    .services-container {
        max-width: 1400px;
        margin: 0 auto;
    }

    .services-eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #004535;
        margin-bottom: 20px;
    }

    .services-heading {
        font-family: 'Inter', sans-serif;
        font-size: clamp(32px, 4.5vw, 60px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.15;
        color: #004535;
        margin-bottom: 24px;
    }

    .services-intro {
        font-size: 17px;
        line-height: 1.8;
        color: #52615B;
        max-width: 750px;
        margin-bottom: 50px;
    }


    /* SERVICE CARDS */

    .service-card {
        background: #F7F7F2;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
    }

    .service-image-wrap {
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: #004535;
    }

    .service-image {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        transition: transform 0.5s ease;
    }

    .service-card:hover .service-image {
        transform: scale(1.045);
    }

    .service-content {
        padding: 30px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .service-name {
        font-family: 'Inter', sans-serif;
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.3;
        color: #004535;
        margin-bottom: 16px;
    }

    .service-desc {
        font-size: 14px;
        line-height: 1.8;
        color: #52615B;
        margin-bottom: 30px;
    }

    .service-link {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #DADFD9;
        font-size: 13px;
        font-weight: 600;
        color: #004535;
    }

    .service-link span {
        font-size: 22px;
        transition: transform 0.2s ease;
    }

    .service-card:hover .service-link span {
        transform: translateX(5px);
    }

    /* CONSULTANCY BANNER */

    .consultancy-banner {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        margin-top: 28px;
        background: #004535;
        color: #FFFFFF;
        text-decoration: none;
        overflow: hidden;
    }

    .consultancy-content {
        padding: 45px;
    }

    .consultancy-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #B7CEC4;
        margin-bottom: 20px;
    }

    .consultancy-title {
        font-family: 'Inter', sans-serif;
        font-size: clamp(26px, 3vw, 40px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin-bottom: 20px;
    }

    .consultancy-desc {
        font-size: 15px;
        line-height: 1.8;
        color: #D2E2DB;
        max-width: 520px;
