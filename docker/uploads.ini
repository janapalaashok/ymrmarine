; Raise PHP's stock upload limits (default upload_max_filesize=2M/post_max_size=8M
; is far too small for survey PDF/Excel/Word reports and scanned attachments).
; Kept generous but bounded rather than "unlimited" — an actually-unbounded
; upload could exhaust memory/disk on the small Cloud Run instance.
upload_max_filesize = 100M
post_max_size = 120M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
